apiVersion: batch/v1
kind: Job
metadata:
  name: jobscout-migrate
  namespace: jobscout
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobscout-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/colewiz7/jobscout:latest
          imagePullPolicy: IfNotPresent
          args: [migrate]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobscout-db-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
