# The behaviour the filters must have, wherever they are deployed.
#
# The repo default and the cluster's configmap are not the same file and never
# will be: the deployed one carries hundreds of boards and the employers being
# targeted, which deliberately do not live in a public repo. So they are held
# to the same behaviour rather than the same bytes, and this is that contract.
titles:
  # infrastructure, in the shapes employers actually write
  - ["DevOps Engineer Co-op", true]
  - ["Site Reliability Engineer Intern", true]
  - ["Infrastructure Engineering Intern, Spring 2027", true]
  - ["Cloud Infrastructure Co-op", true]
  - ["IT Systems Administrator Intern", true]
  - ["Network Engineer Intern", true]
  - ["Systems Development Engineer Intern", true]      # AWS infrastructure track
  - ["Data Center Engineering Operations Intern", true]
  - ["Technology Intern - Summer 2027", true]          # generic program title
  - ["Co-op, Information Technology", true]
  # the go-to-market org reuses the same nouns
  - ["Cloud Sales Intern", false]
  - ["Platform Account Executive", false]
  - ["IT Sales Intern", false]
  - ["Technical Recruiter, Infrastructure", false]
  - ["Recruiting Coordinator - IT", false]
  - ["Product Manager, Cloud Platform", false]
  - ["Customer Success Engineer, Network", false]
  # one word from the infrastructure track, and not it
  - ["Software Development Engineer Intern", false]
  # a place name is not a technology
  - ["Store Executive Intern (Store Leadership Intern) - St. Cloud, MN", false]
  # Phenom slugs are truncated and stripped of punctuation, so the loose slug
  # prefilter lets these through and the real title has to reject them. The
  # slug "cloud-platform-sales-specialist" keeps no trace of the exclusion.
  - ["Cloud Platform Sales Specialist I", false]
  - ["Infrastructure Account Executive, Central", false]
  - ["IT Platform Recruiting Partner", false]
  # and the one it must still keep
  - ["College Intern - Summer 2027 - IT Platform", true]
  # Career Connect, from the first real alert. RIT writes its titles with en
  # dashes rather than hyphens, so the normalisation has to accept both.
  - ["Co-Op \u2013 IT \u2013 Windows Systems Administration (Spring-Summer 2027)", true]
  - ["HR Intern", false]
  # Finance borrows the word: an infrastructure co-op and infrastructure as an
  # asset class read identically until the sense is excluded.
  - ["Intern - Private Infrastructure (Summer 2027)", false]
  - ["Infrastructure Investment Banking Analyst Intern", false]
  - ["Real Assets & Infrastructure Summer Analyst", false]
  - ["Infrastructure Private Equity Intern", false]
  # but the IT sense of the same words survives
  - ["Private Cloud Infrastructure Intern", true]
  # Real titles from the first alert. The Co-Op ones use en dashes, the
  # Software Engineering one a hyphen, in the same batch from one employer.
  - ["Co-Op \u2013 IT \u2013 ServiceNow Platform Administration (Spring-Summer 2027)", true]
  - ["Co-Op \u2013 IT \u2013 Technical Security (Spring-Summer 2027)", true]
  - ["Quantum Infrastructure Intern 2027 - SRE", true]
  - ["Engineering Product Management Specialist I (Intern)", false]
  - ["Smart Buildings Fire & Life Safety Solutions Sales Intern", false]
  - ["2027 Enterprise Finance Intern", false]
  - ["Ratings Analytical Intern - Americas", false]
  - ["Platform Engineering Graduate Intern", false]
  - ["Systems Engineer Intern 🎓", false]

# The level, where a feed publishes schema.org employmentType. A hint, not a
# verdict. [title, employmentType, expected]
levels:
  # INTERN settles it even when the title never says so: real co-ops are
  # titled "Technology Development Program" and nothing else.
  - ["Technology Development Program", "INTERN", true]
  - ["Cloud Platform Engineer", "INTERN", true]
  # PART_TIME and TEMPORARY are not evidence on their own.
  - ["College Intern - Summer 2027 - IT Platform", "PART_TIME", true]
  - ["IT Cloud Engineer Network", "PART_TIME", false]
  - ["Systems Administrator", "TEMPORARY", false]
  - ["Systems Administrator Co-op", "TEMPORARY", true]
  # A FULL_TIME label on a posting titled Intern is a mislabelled feed.
  - ["Infrastructure Engineering Intern", "FULL_TIME", true]
  - ["DevOps Engineer Co-op", "FULL_TIME", true]
  - ["IT Cloud Engineer Network", "FULL_TIME", false]
  # no label at all: the title carries it
  - ["Platform Engineering Intern", null, true]
  - ["Platform Engineer", null, false]
locations:
  - ["Austin, TX", true]
  - ["US-NY-Rochester", true]                          # workday writes it this way
  - ["NY-Rochester", true]
  - ["Winston-Salem, NC", true]
  - ["Remote - US", true]
  - ["3 Locations", true]                              # workday collapses these
  - ["CA-ON-Toronto", false]                           # country first: Canada
  - ["Toronto, Ontario", false]
  - ["Bangalore, India", false]
  - ["OK COMPUTER", false]
  - ["4 Locations; Melbourne AUS; Perth, Australia; Remote", false]
  - ["Austin, TX; Remote", true]

postings:
  - source: workday
    company: GE Vernova
    title: 'DevSecOps Intern (Energy Transition): Nov/Dec 2026 intake'
    location: '4 Locations; Melbourne AUS; Perth, Australia; Remote'
    remote: true
    expected: false
    stale_term: true
  - source: workday
    company: Booz Allen Hamilton
    title: 'University, 2026 Fall Technologist Intern'
    location: 'Honolulu, HI'
    expected: false
    stale_term: true
  - source: workday
    company: Example
    title: 'Platform Engineering Intern - Spring 2027'
    location: 'Rochester, NY'
    expected: true
