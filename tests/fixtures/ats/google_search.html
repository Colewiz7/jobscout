uality.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eBachelor’s degree in Computer Science, Engineering, Mathematics, Physics, or a related field and 2 years of experience in the job offered or in a Site Reliability Engineer-related occupation.\u003c/li\u003e\n\u003cli\u003ePosition requires the following: 2 years of experience in Software development utilizing C++, Python, Java, Go, or JavaScript; 2 years of experience in all the following: Distributed systems, Backend systems, Software architecture for scaled and reliable systems, Debugging/troubleshooting, and Software or System design; 2 years of experience in two of the following: Incident response management, Kubernetes, API design, Performance analysis, Machine learning infrastructure, Applied AI, improving efficiency of the system, security, integration testing, or real-time monitoring and alerting; and 1 year of experience in Distributed computing.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"]],[null,"\u003cp\u003eGoogle Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.\u003c/p\u003eThe US base salary range for this full-time position is $152,800 - $211,000 + 15%  bonus target + equity + benefits determined by role, level, and location. Individual pay is determined by additional factors, including job-related skills, experience, and relevant educa
