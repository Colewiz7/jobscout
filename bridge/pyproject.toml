[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseer-bridge"
version = "0.1.0"
description = "Stdio tool server that drives JobSeer through its dashboard HTTP API"
requires-python = ">=3.12"
# mcp is pinned after comparing 1.30 with 2.3: same features here, but 2.x
# adds a second http stack (httpx2) and imports slower.
dependencies = [
    "httpx>=0.28,<1",
    "mcp==1.30.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
jobseer-bridge = "jobseer_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# ../src is the dashboard under test
pythonpath = ["src", "../src"]
testpaths = ["tests"]
