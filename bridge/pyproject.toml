[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseer-bridge"
version = "0.1.0"
description = "Stdio tool server that drives JobSeer through its dashboard HTTP API"
requires-python = ">=3.12"
# 1.30 pinned, 2.x is heavier
dependencies = [
    "httpx>=0.28,<1",
    "mcp==1.30.0",
]

[project.optional-dependencies]
remote = ["pyjwt[crypto]>=2.8,<3"]
test = ["pytest==9.2.0", "pyjwt[crypto]>=2.8,<3"]

[project.scripts]
jobseer-bridge = "jobseer_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# needed to import the dashboard
pythonpath = ["src", "../src"]
testpaths = ["tests"]
